services:
  postgres:
    image: postgres:15-alpine
    container_name: donation_ai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-donation_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-donation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./donation-ai-api
      dockerfile: Dockerfile
    container_name: donation_ai_backend
    ports:
      - "8000:8000"
    environment:
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - DB_NAME=${POSTGRES_DB:-donation_db}
      - DB_HOST=postgres
      - DB_PORT=5432
      - YOLO_MODEL_PATH=models/best.pt
      - YOLO_CONFIDENCE=0.25
      - MAX_FILE_SIZE_MB=10
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./donation-ai-api/uploads:/app/uploads
      - ./donation-ai-api/results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: donation_ai_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
